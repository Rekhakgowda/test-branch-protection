- name: Modify YAML File on PR
  if: github.event_name == 'pull_request'  # Run only for PRs
  run: |
    python <<EOF
    import yaml

    file_path = "./k8s-manifests/deployment.yaml"  # Change this to your YAML file

    with open(file_path, "r") as f:
        data = yaml.safe_load(f)

    # Ensure "data" exists in the ConfigMap and update the environment
    if data.get("kind") == "ConfigMap" and "data" in data:
        data["data"]["NEW_RELIC_APP_NAME"] = "gbs-claims-genie-qa"

    with open(file_path, "w") as f:
        yaml.dump(data, f, default_flow_style=False)

    print("Updated YAML file successfully with env=qa.")
    EOF
